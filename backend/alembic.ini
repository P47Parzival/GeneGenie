# BioNexus India — Alembic Configuration

[alembic]
# Path to migration scripts (relative to this file)
script_location = database/migrations

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# Truncate long revision IDs in filenames
truncate_slug_length = 40

# Timezone for migration timestamps
# timezone =

# max length of characters to apply to the "slug" field
# revision_environment = false

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# Connection string — overridden in env.py from settings
sqlalchemy.url = postgresql://bionexus:bionexus_secret@localhost:5432/bionexus


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
